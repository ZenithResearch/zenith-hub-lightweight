name: zenith-process-demo
services:
  hub:
    image: zenith-process-hub:local
    build:
      context: ../..
      dockerfile: profiles/process-docker/Dockerfile
      additional_contexts:
        sources: ./context
    init: true
    ports:
      - "127.0.0.1:4218:4218"
    volumes:
      - demo-data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8091/ready', timeout=2); urllib.request.urlopen('http://127.0.0.1:8092/ready', timeout=2); urllib.request.urlopen('http://127.0.0.1:4218/', timeout=2)"]
      interval: 15s
      timeout: 8s
      start_period: 60s
      retries: 3
    stop_grace_period: 20s
volumes:
  demo-data:
