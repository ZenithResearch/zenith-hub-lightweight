name: Lightweight deployer
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check:source
      - run: python3 -m unittest tests/test_provider_activation.py
      - run: npm run test:deployer
      - run: npm run typecheck
      - run: npm run build
      - run: npm audit --audit-level=moderate
