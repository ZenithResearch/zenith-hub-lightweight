name: Local process example
on:
  pull_request:
  push:
    branches: [main]
    tags: ['*']
permissions:
  contents: read
jobs:
  clean-clone:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install the headless browser for the smoke test
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/hub-test-browser
        run: |
          npm exec --yes --package=playwright-core@1.65.1 -- playwright-core install --only-shell chromium
          python3 - <<'PY'
          import os
          from pathlib import Path
          root = Path(os.environ["PLAYWRIGHT_BROWSERS_PATH"])
          browser, = [p for p in root.rglob("*") if p.name in {"headless_shell", "chrome-headless-shell"}
                      and p.is_file() and os.access(p, os.X_OK)]
          with open(os.environ["GITHUB_ENV"], "a") as env:
              print(f"CHROME_BIN={browser}", file=env)
          PY
      - run: node scripts/smoke-clean-clone.mjs --process-example
        env:
          HUB_SMOKE_EVIDENCE: ${{ runner.temp }}/hub-example-evidence
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: local-process-example
          path: ${{ runner.temp }}/hub-example-evidence
