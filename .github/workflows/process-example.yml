name: Local process example
on:
  pull_request:
  push:
    branches: [main]
    tags: ['*']
permissions:
  contents: read
jobs:
  clean-clone:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: node scripts/smoke-clean-clone.mjs --process-example
        env:
          HUB_SMOKE_EVIDENCE: ${{ runner.temp }}/hub-example-evidence
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: local-process-example
          path: ${{ runner.temp }}/hub-example-evidence
